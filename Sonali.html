<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonali</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--gold:#d9b878;--rose:#c76b8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);overflow:hidden;display:grid;place-items:center}
.aur{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.aur i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.34;animation:drift 26s ease-in-out infinite alternate}
.aur i:nth-child(1){background:#2b4a8a;left:-25vmax;top:-20vmax}
.aur i:nth-child(2){background:var(--rose);right:-35vmax;top:30vh;opacity:.22;animation-duration:32s}
.aur i:nth-child(3){background:var(--gold);left:5vmax;bottom:-45vmax;opacity:.16;animation-duration:38s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#fx{z-index:20}
.pic{position:relative;z-index:2;width:min(68vw,300px);aspect-ratio:1;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;perspective:900px;transition:opacity .35s,transform .35s;-webkit-tap-highlight-color:transparent}
.pic:focus-visible{outline:3px solid var(--gold);outline-offset:10px}
.pic.hide{opacity:0;transform:scale(.85);pointer-events:none}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:26px;padding:0 20px;text-align:center}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.coin{position:absolute;inset:0;transform-style:preserve-3d;animation:flt 4.5s ease-in-out infinite}
.cap{margin:0;font:700 clamp(2.6rem,13vw,3.6rem)/1 'Cormorant Garamond',Georgia,serif;background:linear-gradient(100deg,#f3e3bd,#d9b878,#f3e3bd,#d9b878);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
.hint{margin:-10px 0 0;color:#b9b3c6;font:600 .85rem 'Manrope',system-ui,sans-serif;letter-spacing:.5px;animation:pulse 3s ease-in-out infinite}
@keyframes sheen{to{background-position:250% 0}}
.f{position:absolute;inset:0;border-radius:50%;background:var(--p) 50% 18%/cover no-repeat,#1b2140;border:3px solid var(--gold);box-shadow:0 0 0 9px rgba(217,184,120,.14),0 0 60px rgba(217,184,120,.35);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f.b{transform:rotateY(180deg)}
@keyframes flt{50%{transform:translateY(-10px)}}
.glow{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(217,184,120,.28),transparent 65%);animation:pulse 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12);opacity:.65}}
.lb{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(6,9,20,.88);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;cursor:zoom-out;padding:20px}
.lb.on{opacity:1;visibility:visible;transition:opacity .35s}
.lb img{max-width:94vw;max-height:84vh;border-radius:18px;border:2px solid var(--gold);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 60px rgba(217,184,120,.25);transform:scale(.4) rotateY(90deg);transition:transform .6s cubic-bezier(.2,1.1,.3,1)}
.lb.on img{transform:none}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(217,184,120,.4);background:rgba(11,16,32,.7);color:#f3ede4;cursor:pointer;display:grid;place-items:center;padding:0}
.x:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.burger{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:13;width:44px;height:44px;border-radius:12px;border:1px solid rgba(217,184,120,.4);background:rgba(11,16,32,.7);backdrop-filter:blur(6px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0;cursor:pointer}
.burger i{display:block;width:20px;height:2px;border-radius:2px;background:#f3ede4;transition:transform .3s,opacity .3s}
.burger.x i:nth-child(1){transform:translateY(7px) rotate(45deg)}.burger.x i:nth-child(2){opacity:0}.burger.x i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.burger:focus-visible,.mi:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:11}.ov.open{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;bottom:0;left:0;width:min(82vw,300px);padding:calc(76px + env(safe-area-inset-top,0px)) 20px 24px;background:#0f1630;border-right:1px solid rgba(217,184,120,.4);z-index:12;transform:translateX(-105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),visibility 0s .35s;text-align:left;color:#f3ede4;font-family:'Manrope',system-ui,sans-serif}
.menu.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.menu h3{margin:0 0 14px;font:700 1.6rem 'Cormorant Garamond',Georgia,serif;color:var(--gold)}
.mi{width:100%;text-align:left;font:700 1rem 'Manrope',system-ui,sans-serif;color:inherit;background:rgba(255,255,255,.07);border:1px solid rgba(217,184,120,.4);border-radius:12px;padding:14px;min-height:48px;cursor:pointer}
#od{margin-top:12px;padding:4px 16px;border-radius:12px;background:rgba(217,184,120,.08);border:1px solid rgba(217,184,120,.4);animation:odin .35s}
@keyframes odin{from{opacity:0;transform:translateY(-8px)}}
#od[hidden]{display:none}#od p{margin:14px 0}#od small{display:block;color:#b9b3c6;font-size:.78rem;letter-spacing:.6px}#od b{font-size:1.08rem;font-weight:800}
.blur{display:inline-block;filter:blur(6px);user-select:none;-webkit-user-select:none;pointer-events:none;font-size:1.08rem;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="dust" aria-hidden="true"></canvas><canvas id="fx" aria-hidden="true"></canvas>
<button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
<div class="ov" id="ov"></div>
<nav class="menu" id="menu" aria-hidden="true"><h3>Menu</h3>
<button class="mi" id="oi" aria-expanded="false" aria-controls="od">Owner Details</button>
<div id="od" hidden><p><small>OWNER NAME</small><b>SAMEER</b></p><p><small>OWNER NUMBER</small><span class="blur" aria-hidden="true">9639986804</span></p><p><small>ROLE</small><b>Software Engineer</b></p></div></nav>
<div class="stage">
<button class="pic" id="pic" type="button" aria-label="Sonali ki photo kholiye">
  <span class="glow"></span>
  <span class="tilt" id="tilt"><span class="coin"><span class="f"></span></span></span>
</button>
<h1 class="cap">Sonali</h1>
<p class="hint">Photo par tap kijiye</p>
</div>

  <img id="big" alt="Sonali">
</div>
